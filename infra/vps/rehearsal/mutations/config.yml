# Mutation: wheeld's own signup flag opened while the edge still blocks it, and a web origin with
# the wrong scheme. `signup-closed-at-wheeld` and `sign-in` must turn red; the edge checks must not.
#
# verify-signup-gate needs the SAME override wheeld gets: it makes its own real HTTP call and
# checks the answer against WHEEL_SIGNUP, so if only wheeld's copy changes, the gate correctly
# notices the two disagree and refuses to start anything downstream — which blocks this mutation's
# own test setup rather than exercising it. Keeping both in sync is what lets the mutation reach
# the checks it's meant to turn red, instead of failing at compose-up for an unrelated reason.

services:
  wheeld:
    environment:
      WHEEL_SIGNUP: open
  verify-signup-gate:
    environment:
      WHEEL_SIGNUP: open
  web:
    environment:
      WHEEL_PUBLIC_ORIGIN: http://${WHEEL_DOMAIN:-localhost}
