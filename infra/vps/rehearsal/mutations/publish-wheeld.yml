# Mutation: the mistake `loopback-only` exists to catch — a bind that isn't 127.0.0.1.
# wheeld already publishes on 127.0.0.1:8080 by design (the SSH-tunnel path), so exercising a real
# failure means overriding that to a non-loopback bind, not merely adding a second port.

services:
  wheeld:
    ports:
      - "127.0.0.1:8080:8080"
      - "0.0.0.0:18080:8080"
