# Wheel on one server. Two modes, chosen by whether WHEEL_DOMAIN is set — never invoke this file
# directly with `docker compose`; use ./deploy.sh (a real server) or ./rehearse.sh (a laptop),
# both of which compute the settings below from infra/vps/.env via lib/derive-env.sh.
#
#   tunnel (default, no WHEEL_DOMAIN): wheeld and web publish on 127.0.0.1 only. Caddy does not
#     run. Reach the board over an SSH tunnel. Nothing on this host is reachable from the network.
#   TLS (WHEEL_DOMAIN set): Caddy starts (COMPOSE_PROFILES=tls) and is the only public listener,
#     on 80 and 443. wheeld and web still publish on 127.0.0.1 too — that is never a public
#     exposure, and it is a convenient direct path for the operator's own tunnel or for debugging.
#
# There is no third mode that serves plain HTTP to the internet. A VPS's published ports are
# reachable the moment anything upstream — a misconfigured cloud firewall, ufw not covering
# Docker's own iptables rules — lets traffic through, and a password or a wht_ token does not get
# a second chance once it has crossed the network once in the clear.

name: wheel

services:
  preflight:
    image: caddy:2
    network_mode: none
    restart: "no"
    entrypoint: ["/bin/sh", "/preflight.sh"]
    volumes:
      - ./preflight.sh:/preflight.sh:ro
    environment:
      - WHEEL_DOMAIN
      - ACME_EMAIL
      - WHEEL_TLS_INTERNAL
      - COMPOSE_PROFILES
      - WHEEL_SIGNUP=${WHEEL_SIGNUP:-closed}

  wheeld:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.wheeld
    restart: unless-stopped
    # wheeld drains in-flight turns on SIGTERM (~28s) before stopping every agent's process group
    # itself; this gives real margin over that rather than the bare minimum.
    stop_grace_period: 35s
    depends_on:
      preflight:
        condition: service_completed_successfully
    environment:
      # Bare (no `=`) so an unset one is OMITTED, not passed through empty: wheeld's own default
      # (derived from its bind address) applies only when the key is absent entirely. Resolved by
      # lib/derive-env.sh from WHEEL_DOMAIN — never hand-set these.
      - PUBLIC_BASE_URL
      - WHEEL_TRUSTED_PROXIES
      - WHEEL_ALLOWED_HOSTS=${WHEEL_ALLOWED_HOSTS:-wheeld}
      - WHEEL_SIGNUP=${WHEEL_SIGNUP:-closed}
      - RUST_LOG=${RUST_LOG:-info}
    ports:
      # Loopback only, in every mode. Reachable from this machine (an SSH tunnel, or the operator
      # themselves) and never from the network, whether or not Caddy is also running.
      - "127.0.0.1:${WHEEL_WHEELD_PORT:-8080}:8080"
    volumes:
      - wheel-data:/data
    networks:
      - edge
      - egress

  # A config value is not a control until the running binary is proven to enforce it: preflight
  # only checks that WHEEL_SIGNUP is a well-formed string, which says nothing about whether the
  # container actually running as "wheeld" is the wheeld binary at all — someone working around a
  # broken build by pointing this service at a different Dockerfile would sail straight past a
  # static check. This makes one real HTTP call against wheeld's own documented response shape
  # (docs/API.md) and fails the whole stack if it doesn't match. web and caddy both wait on it, so
  # a wheeld that doesn't enforce its own signup gate never gets a public-facing peer in front of it.
  verify-signup-gate:
    image: curlimages/curl:8.11.0
    restart: "no"
    entrypoint: ["/bin/sh", "/verify-signup-gate.sh"]
    volumes:
      - ./verify-signup-gate.sh:/verify-signup-gate.sh:ro
    environment:
      - WHEEL_SIGNUP=${WHEEL_SIGNUP:-closed}
    depends_on:
      wheeld:
        condition: service_healthy
    networks:
      - edge

  web:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      preflight:
        condition: service_completed_successfully
      wheeld:
        condition: service_healthy
      verify-signup-gate:
        condition: service_completed_successfully
    environment:
      - WHEEL_API_URL=http://wheeld:8080
      - WHEEL_AUTH_MODE=local
      # WHEEL_PUBLIC_ORIGIN is authoritative for the session cookie's Secure flag and the CSRF
      # origin check, in both modes: https://<domain> in TLS mode, http://localhost:<port> in
      # tunnel mode (matching what an SSH-tunneled browser actually sees). WHEEL_TRUST_PROXY is
      # bare: "1" only in TLS mode, where Caddy is the web server's only peer and overwrites
      # X-Forwarded-Proto/Host; omitted in tunnel mode, where nothing proxies to it at all.
      - WHEEL_PUBLIC_ORIGIN=${WHEEL_PUBLIC_ORIGIN:-http://localhost:3000}
      - WHEEL_TRUST_PROXY
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:${WHEEL_WEB_PORT:-3000}:3000"
    # Also on egress, matching wheeld, or its own loopback publish above does not work at all:
    # measured directly (a minimal nginx container, no compose, no other setting) that Docker
    # accepts a published port on a container whose ONLY network is `internal: true` but the
    # forwarding never actually functions — connections to the host port fail outright. Attaching
    # a second, non-internal network is what makes port publishing work at the kernel level; it is
    # not optional here, in either mode. Residual, stated rather than hidden: this container's
    # network namespace has a path outward through egress, the same class of exposure an agent's
    # own container already has. The web app's own code makes exactly one outbound call —
    # WHEEL_API_URL, i.e. wheeld — and has no other server-side fetch capability; this is not a
    # sandbox boundary claim, only a note on what would have to be true for it to matter.
    networks:
      - edge
      - egress

  caddy:
    image: caddy:2
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      preflight:
        condition: service_completed_successfully
      verify-signup-gate:
        condition: service_completed_successfully
      wheeld:
        condition: service_started
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Deliberately no fallback: Compose interpolates every service's environment before it
      # filters by profile (measured — a `:?` guard here fires even when the tls profile is
      # inactive and this service is never created), so this cannot refuse to boot AT THE COMPOSE
      # LEVEL the way preflight does. The Caddyfile itself is what refuses to start on an empty
      # CADDY_SITE, so a caddy container started without WHEEL_DOMAIN — by hand, bypassing
      # deploy.sh/rehearse.sh — fails loudly instead of silently binding plain HTTP to :80.
      CADDY_SITE: ${WHEEL_DOMAIN:-}
      CADDY_EMAIL_OPTION: ${ACME_EMAIL:+email ${ACME_EMAIL}}
      CADDY_TLS_OPTION: ${WHEEL_TLS_INTERNAL:+tls internal}
      WHEEL_SIGNUP: ${WHEEL_SIGNUP:-closed}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      public: {}
      edge:
        ipv4_address: ${WHEEL_CADDY_IP:-10.231.8.10}

networks:
  public: {}
  # No gateway: nothing on this network can reach the internet or be published through it.
  edge:
    internal: true
    ipam:
      config:
        - subnet: ${WHEEL_EDGE_SUBNET:-10.231.8.0/24}
  egress: {}

volumes:
  wheel-data:
  caddy-data:
  caddy-config:
