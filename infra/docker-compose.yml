# Local development stack: postgres + api + host, and the board UI under `--profile web`.
# (For running Wheel rather than developing it, infra/compose.wheeld.yml is one container.)
#
# The security-relevant line in this file is the docker socket mount: it is on the **host** service
# only. Anything that can reach the docker socket can trivially escape to the machine (mount the
# root filesystem into a new container), so the internet-facing API must never see it. That is why
# the API is a pure gateway and the host is the only thing that touches a container runtime.
#
# Every published port is on this machine's loopback, and only what a person on this machine needs
# is published at all: the API, and the web UI when its profile is on.

name: wheel

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wheel
      POSTGRES_PASSWORD: wheel
      POSTGRES_DB: wheel
    # Not published: only the api talks to it, over the compose network. For a shell:
    # `docker compose -f infra/docker-compose.yml exec postgres psql -U wheel`.
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wheel"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [wheel]

  host:
    build:
      context: ..
      # SDK owns docker/Dockerfile.host (the full image with engine + cli + claude + codex).
      # Until that lands, this dev image builds just the supervisor so the stack can run.
      dockerfile: infra/dev/Dockerfile.host.dev
    environment:
      SANDBOX_BACKEND: docker
      WHEEL_HOST_SECRET: ${WHEEL_HOST_SECRET:-dev-host-secret-at-least-16-chars}
      # The real engine image, built by `make engine-image` from docker/Dockerfile.host. Set
      # ENGINE_IMAGE=wheel-engine:stub to run against the fake in infra/dev/ instead; the tags are
      # kept distinct so a stub can never be mistaken for the real engine.
      ENGINE_IMAGE: ${ENGINE_IMAGE:-wheel-engine:dev}
      DOCKER_NETWORK: wheel
      BIND_ADDR: 0.0.0.0:7100
      RUST_LOG: info,wheel_host=debug
    volumes:
      # The docker socket lives HERE and nowhere else in this stack.
      - /var/run/docker.sock:/var/run/docker.sock
      - hostdata:/data
    # No published ports: the host is reachable only from the API on the private network,
    # mirroring production where it has no public domain.
    expose: ["7100"]
    networks: [wheel]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      WHEEL_ENV: dev
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://wheel:wheel@postgres:5432/wheel
      # Dev defaults: with AUTH_DEV_SECRET set, HS256 tokens are verified locally and the
      # JWKS endpoint is never contacted. `iss` is still validated, so minted tokens must carry
      # exactly CLERK_ISSUER.
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-http://localhost/unused-jwks}
      CLERK_ISSUER: ${CLERK_ISSUER:-https://dev.wheel.local}
      API_MASTER_KEY: ${API_MASTER_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      WHEEL_HOST_URL: http://host:7100
      WHEEL_HOST_SECRET: ${WHEEL_HOST_SECRET:-dev-host-secret-at-least-16-chars}
      PUBLIC_BASE_URL: http://localhost:8080
      # No browser origins: the web UI calls the API from its own server. Set this only for a
      # browser client you are deliberately developing against the API directly.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Local HS256 tokens for testing without Clerk. Only honoured because WHEEL_ENV=dev;
      # the API refuses to boot if this is set with WHEEL_ENV=prod.
      AUTH_DEV_SECRET: ${AUTH_DEV_SECRET:-dev-only-hs256-secret}
      RUST_LOG: info,wheel_api=debug
    ports: ["127.0.0.1:8080:8080"]
    networks: [wheel]

  web:
    profiles: ["web"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    depends_on: [api]
    environment:
      # Read by the web server at runtime. The browser never talks to the API.
      WHEEL_API_URL: http://api:8080
      WHEEL_AUTH_MODE: local
    ports: ["127.0.0.1:3000:3000"]
    networks: [wheel]

volumes:
  pgdata:
  hostdata:

networks:
  wheel:
    name: wheel
    # The host also attaches per-project engine containers to this network by name, and it may
    # already exist from a previous run or from the host itself. Declaring it external stops
    # compose from refusing to adopt a network it did not create.
    external: true
