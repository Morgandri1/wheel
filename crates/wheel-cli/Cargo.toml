[package]
name = "wheel-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The `wheel` binary: how an agent or script reaches its board."

[[bin]]
name = "wheel"
path = "src/main.rs"

[dependencies]
wheel-core = { path = "../wheel-core" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
ureq = { version = "2", default-features = false, features = ["json"] }
