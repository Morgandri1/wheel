[package]
name = "wheel-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Per-project Wheel engine: control plane, sqlite, wire enforcement, agent supervisor."

[lib]
name = "wheel_engine"
path = "src/lib.rs"

[[bin]]
name = "wheel-engine"
path = "src/main.rs"

[dependencies]
wheel-core = { path = "../wheel-core" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
libc = "0.2"
aes-gcm = "0.10"
base64 = "0.22"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled", "hooks", "limits"] }
tower-http = { version = "0.6", features = ["trace"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server"] }
rand = "0.8"
time = { version = "0.3", features = ["std"] }
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
