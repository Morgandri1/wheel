[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Agents build Wheel inside a 4.6 GB volume, and debug info is most of what a
# target directory weighs -- 1.4 GB of the 1.7 GB measured here. Line tables keep
# backtraces useful and drop the rest; incremental state is another 567 MB that
# buys nothing for a from-clean build.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

# Railway ships these binaries and pays for the image. Defaults optimise for
# rebuild speed on a developer's laptop, which is the wrong trade for a
# container that is built once and run for days.
#
# `panic = "unwind"` is deliberate and load-bearing: the delivery loop catches a
# panic to quarantine the message that caused it, and `abort` would turn one bad
# body back into a dead project.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
incremental = false
