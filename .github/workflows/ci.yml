name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Keyed by SHA on main, by ref elsewhere. cancel-in-progress alone was not enough:
  # a concurrency group holds at most ONE running plus ONE pending run, and a newly
  # queued run evicts the pending one regardless of that flag. With a per-ref group,
  # main could therefore never produce more than one verdict per burst of merges —
  # eight consecutive main runs came back "cancelled" and main was unverified.
  # Per-SHA groups let main runs proceed in parallel so every merge gets its own
  # verdict. Branches and PRs keep per-ref cancellation, where only the latest matters.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Never cancel a run on main. Merges land every few minutes, and cancel-in-progress
  # meant each one killed the previous run's verdict — eight consecutive "cancelled"
  # results and no completed check on main for over half an hour. A cancelled run is
  # indistinguishable from an untested commit, so main was effectively unverified.
  # Main runs now queue and each merge gets its own verdict, even if it lags.
  # Branches and PRs still cancel, where only the latest result is interesting.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # API's DB-backed tests skip themselves when TEST_DATABASE_URL is unset, so CI without
    # a database silently ran a smaller suite than anyone thought. A service container is
    # cheap; a coverage gate measuring tests that never ran is not.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wheel
          POSTGRES_PASSWORD: wheel
          # API asked for an empty database named wheel_test; their migrations run on
          # boot and are idempotent, so CI must NOT pre-create tables or add a migrate
          # step. Naming it *_test also makes it obvious this database is disposable.
          POSTGRES_DB: wheel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wheel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://wheel:wheel@localhost:5432/wheel_test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # Web is not on main yet. actions/setup-node resolves cache-dependency-path at
      # setup time and hard-fails when web/pnpm-lock.yaml is absent, which killed the
      # whole run in 17s and masked the real gate failures behind it. Both steps are
      # conditional, and caching only turns on once the lockfile actually exists.
      - id: web
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f web/pnpm-lock.yaml ]; then echo "lock=true" >> "$GITHUB_OUTPUT"
          else echo "lock=false" >> "$GITHUB_OUTPUT"; fi

      - if: steps.web.outputs.present == 'true'
        uses: pnpm/action-setup@v4
        with: { version: 9 }
      - if: steps.web.outputs.present == 'true' && steps.web.outputs.lock == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - if: steps.web.outputs.present == 'true' && steps.web.outputs.lock != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Bootstrap first: qa/.venv is gitignored, and without it the schema contract
      # gate SKIPS. A skipped gate on main is a blind spot — it hid BUG-003.
      - run: make bootstrap
      # check-strict: coverage enforced per crate (§0b), and a gate that COULD NOT RUN is
      # a failure here — in CI that is a broken pipeline pretending to be a passing one.
      # An area that does not exist yet (no web/) is reported, not failed.
      - run: make check-strict

  # PM A10 (efficiency is P1). The crate-count half is cheap and rides in `make check`;
  # this is the other half, and it needs a real fat-LTO release build of the workspace --
  # minutes and gigabytes, which is why it is not in the job everyone waits for and not on
  # a laptop with six agents resident.
  #
  # Only on main. A release build on every PR would itself be the kind of waste this
  # ticket exists to stop, and the number it produces is a property of what we ship, not
  # of a proposed change.
  size:
    name: release binary size
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The budget seeds itself from the first real measurement rather than from a number
      # somebody guessed, so the first run on main records the ceiling and later runs
      # ratchet it down.
      - run: make size

  # API's crates/wheel-host/tests/sandbox_docker.rs creates and destroys real containers
  # and asserts the hardening rather than trusting it: cap_drop ALL with exactly
  # SETUID+SETGID (the COUNT is asserted, so a third capability cannot creep in),
  # no-new-privileges, memory and pid caps, and that no port is published.
  #
  # It lives in its own job, not in `check`, because the image is a release build and
  # `check` must stay fast. WHEEL_CI_HAS_DOCKER=1 is set HERE and only here, following
  # API's own convention: the flag asserts "the dependency was promised", so it belongs
  # where the daemon and the image genuinely exist. Setting it in `check` — which builds
  # no image — would fail for a missing dependency nobody promised, which is the same
  # mistake as keying on CI itself.
  docker-sandbox:
    name: docker sandbox (wheel-host)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-docker-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-docker-${{ runner.os }}-

      # FIRST, because it is the fastest way to learn that main is broken on Linux.
      #
      # Every agent on this project develops on one macOS host, so a local `make check`
      # cannot catch a Linux-only break — not by oversight, by construction. Two reached
      # main in one day: an E0308 in wheel-host's rlimits that shipped a host image with no
      # host binary in it, and then the clippy error in the fix for it (`as u32` is required
      # on macOS, redundant on glibc, and `-D warnings` makes redundant fatal). For anything
      # touching libc, #[cfg] or the images, "green locally" carries no information, and we
      # were all reading it as though it did.
      #
      # This runs here rather than as a new job so it costs no extra runner and reuses this
      # job's cargo cache: a Linux verdict in ~1 minute instead of at full-CI time.
      - name: Clippy on Linux (the platform we actually deploy to)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build wheel-engine:dev
        run: make engine-image

      # The image shipped without the `wheel` binary once: Dockerfile.host built the wrong
      # bin name and `|| true` swallowed the error, so the build stayed green and the CLI
      # was simply absent. This asserts the image contains what it must, every build.
      - name: Verify image contents
        run: make image-verify-prod

      # qa:image-contents lives here rather than in `make check`, which builds no image and
      # would therefore fail it forever under CHECK_STRICT. ci_workflow_lint.py asserts this
      # step still exists in a job that builds the image — otherwise "moved" and "silently
      # stopped running" look identical, which is the failure this repo keeps finding.
      - name: Contract — image contents (qa:image-contents)
        run: python3 qa/contract/image_contents.py

      - name: Docker-backed sandbox tests
        env:
          WHEEL_CI_HAS_DOCKER: "1"
        run: cargo test -p wheel-host

  integration:
    name: integration (docker + fake harness)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Was `if: false` while the engine image did not exist. The image landed, and the
    # suite (127 assertions, incl. all 243 wire-matrix cells against a real engine) had
    # been running only on my laptop — a disabled job reports the same green as a passing
    # one, which is the exact failure this suite exists to catch. Enabled.
    strategy:
      fail-fast: false
      # `process` is M3. It is left out rather than allowed to fail: a row that is red on
      # every run teaches people to stop reading the column.
      matrix:
        backend: [docker]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The suite's python deps (websocket-client, jsonschema, pytest) live in qa/.venv.
      # Without this, test_engine_events.py exits 77 "websocket-client not installed" and
      # the events WS is not checked at all — a gate that skips is not a gate that passes.
      - run: make bootstrap
      - run: make engine-image-test
      - run: make test-int
        env:
          SANDBOX_BACKEND: ${{ matrix.backend }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ matrix.backend }}
          path: qa/.artifacts/

  packaged-web:
    name: packaged board (npx wheel-web)
    runs-on: ubuntu-latest
    # A real `next build` — minutes, so it is opt-in locally (`make test-pkg`) and lives
    # here, for the same reason the wheel-on-wheel build leg does. This is the only job that
    # tests what a user installs rather than what we develop against.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # `version: 9`, like the other two jobs that do this. pnpm/action-setup reads
      # `packageManager` from the package.json at the REPO ROOT, and ours is in web/ --
      # so without a version this job died at setup with "No pnpm version is specified",
      # before a single assertion ran. A job that never starts reports the same red as a
      # job that found a bug, and I copied the shape from a job that had this right.
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # No explicit Playwright install: `pnpm -C web exec playwright` looks for it in web/,
      # where it does not live — it is a dependency of qa/e2e — so this job died with
      # `Command "playwright" not found` before running anything. qa/e2e/run.sh already
      # installs qa/e2e's node_modules and chromium, which is why the e2e job needs no such
      # step either. `make test-pkg` calls it. I added a step the working job does not have,
      # to solve a problem it does not have.
      - run: pnpm -C web install --frozen-lockfile
      - run: make test-pkg

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-web-report
          path: qa/e2e/playwright-report/

  wheel-on-wheel:
    name: wheel-on-wheel (agent clones and builds Wheel)
    runs-on: ubuntu-latest
    # The build leg compiles wheel-core inside the sandbox. On the shared dev host, with
    # six agents resident, it is OOM-killed before it finishes -- so it runs HERE, on a
    # runner with the machine to itself, and stays WHEEL_WOW_SKIP_BUILD=1 locally
    # (PM ruling 2026-09-06). The clone leg is the cheap half and runs in both places.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make bootstrap
      - run: make engine-image-test
      - name: Agent clones and builds Wheel inside its own sandbox
        run: python3 qa/integration/test_wheel_on_wheel.py
        env:
          WHEEL_WOW: "1"
          # The suite's own preflight skips by name when this is absent, so a fork without
          # the secret reports "no GitHub token" rather than a spurious red.
          WHEEL_WOW_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the engine's log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-on-wheel-logs
          path: qa/artifacts/

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Browsers cannot be launched on the shared dev host under six resident agents
      # (chromium dies with "spawn Unknown system error -88"), so this suite runs here,
      # where it has the machine to itself.
      - run: make test-e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qa/e2e/playwright-report/

  # NOTE: there is deliberately NO job that runs `make test-live`. Live runs hit the
  # real claude/codex CLIs, cost money and are non-deterministic. Humans only.
